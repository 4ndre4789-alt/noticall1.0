name: Build Noticall APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build Noticall APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Noticall-v1.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noticall-v1.4-APK
          path: Noticall-v1.4.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="noticall-v1.4-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Noticall-v1.4.apk \
            --title "Noticall v1.4 - Build ${GITHUB_RUN_NUMBER}" \
            --notes "Build automatica di test di Noticall v1.4."
